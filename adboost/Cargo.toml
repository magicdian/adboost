[package]
authors.workspace = true
description = "Rust ADB (Android Debug Bridge) client library"
edition.workspace = true
keywords.workspace = true
license.workspace = true
name = "adboost"
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["framebuffer"]
mdns = ["dep:mdns-sd"]
usb = ["dep:nusb"]
framebuffer = ["dep:image"]
# ADB **server** frontend: listen on TCP (default :5037), speak the smartsocket
# host protocol to native `adb`/`scrcpy` clients, and bridge local services to a
# device backend. The bundled `UsbDeviceBackend` rides on the `usb` stack, so
# `server` implies `usb`. OFF by default — pure client users are unaffected.
server = ["usb", "dep:futures-util"]
# Deterministic in-memory ADB-device simulator for protocol/timing tests
# (`message_devices::usb::sim`): a stateful adbd model + a byte-level chunked
# transport, driving the real `PersistentConnection` reader/writer loops without
# hardware. adboost's own inline tests get it for free via `cfg(test)`; this
# feature exposes it to SEPARATE test crates (CLI selftest, downstream `xdb`),
# which cannot see `cfg(test)` symbols. Rides the `usb` stack (the persistent
# connection + transport seam live under `usb`). OFF by default — pure runtime
# users never compile it. The standard `tokio`/`proptest` `test-util` idiom.
test-support = ["usb"]
# Optional convenience initializer (`init_tracing_from_env`); OFF by default.
# The library itself never installs a subscriber — it stays a pure emitter.
tracing-init = ["dep:tracing-subscriber"]

[dependencies]
base64 = { version = "0.22.1" }
byteorder = { version = "1.5.0" }
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }
num-bigint = { version = "0.8.6", package = "num-bigint-dig" }
num-traits = { version = "0.2.19" }
quick-protobuf = { version = "0.8.1" }
rand = { version = "0.10.1" }
rcgen = { version = "0.14.8", default-features = false, features = [
    "ring",
    "pem",
] }
regex = { version = "1.12.3", features = ["perf", "std", "unicode"] }
rsa = { version = "0.9.10" }
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.14.1" }
sha1 = { version = "0.10.6", features = ["oid"] }
thiserror = { version = "2.0.18" }
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
    "macros",
    "fs",
] }
tokio-util = { version = "0.7.18", features = ["compat"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12", "logging"] }
# `log` feature: every tracing event also emits a `log` record, so existing
# `log`/`env_logger` consumers (and the not-yet-migrated CLI) keep seeing output.
tracing = { version = "0.1", features = ["log"] }
# Optional, feature-gated subscriber for `init_tracing_from_env` only — never a
# default dependency; the library remains a pure emitter.
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }
trait-variant = { version = "0.1.2" }

#########
# `mdns` feature-specific dependencies
mdns-sd = { version = "0.19.2", default-features = false, features = [
    "logging",
], optional = true }
#########
#########
# USB-only dependencies
nusb = { version = "0.2", features = ["tokio"], optional = true }
num_enum = { version = "0.7.6" }
#########
#########
# `server` feature-specific dependencies
# `futures-util` drives nusb's hotplug `Stream` (StreamExt::next) in the default
# USB backend's device-change subscription. Already in the tree (transitive); we
# depend on it explicitly only when `server` is on.
futures-util = { version = "0.3", default-features = false, optional = true }
#########

[dev-dependencies]
anyhow = { version = "1.0.102" }
criterion = { version = "0.8.2" } # Used for benchmarks
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }

[[bench]]
harness = false
name = "benchmark_adb_push"
path = "../benches/benchmark_adb_push.rs"

# Diagnostic harness for the wait-for-disconnect redesign (task PR0). It uses the
# optional `tracing-subscriber` (the `tracing-init` feature) and the USB stack, so
# declare those as `required-features`: `cargo build/clippy --all-targets` then
# skips it unless both are enabled, instead of failing to resolve the optional dep.
[[example]]
name = "root_disconnect_probe"
required-features = ["usb", "tracing-init"]
