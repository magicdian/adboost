[package]
authors.workspace = true
description = "Rust ADB (Android Debug Bridge) CLI"
edition.workspace = true
keywords.workspace = true
license.workspace = true
name = "adboost_cli"
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
adboost = { path = "../adboost", features = ["mdns", "usb", "server"] }
clap = { version = "4.6.1", features = ["derive"] }
tabwriter = { version = "1.4.1" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
# Only needed so the self-test unit tests can implement the framebuffer arm of
# `ADBDeviceExt` (default `framebuffer` feature) on their hardware-free fake
# device. Mirrors adboost's image version/features.
image = { version = "0.25.10", default-features = false, features = ["png"] }

[target.'cfg(unix)'.dependencies]
termios = { version = "0.3.3" }
# Daemon control on Unix: setsid (detach) on the spawned child + SIGTERM/`kill(0)`
# liveness for `server kill`. Already in the dependency tree transitively.
libc = { version = "0.2" }

#####################################
# Debian package build instructions #
#####################################
[package.metadata.deb]
assets = [
    { source = "target/release/adboost_cli", dest = "usr/bin/", mode = "755" },
]
priority = "optional"
section = "utility"

##################################
# RPM package build instructions #
##################################
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/adboost_cli", dest = "/usr/bin/adboost_cli", mode = "755" },
]
license = "Apache-2.0 AND MIT"
