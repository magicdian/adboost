[workspace]
# Async rewrite: `adb_client` (library) + `adboost_cli` (async CLI, migrated).
# `pyadb_client` and `examples/mdns` still depend on the old sync API and stay
# excluded until they are migrated in a later, separate task.
members = ["adb_client", "adboost_cli"]
resolver = "2"

[workspace.package]
authors = ["Corentin LIAUD", "jdjingdian"]
edition = "2024"
homepage = "https://github.com/magicdian/adboost"
keywords = ["adb", "android", "tcp", "usb"]
license = "Apache-2.0 AND MIT"
repository = "https://github.com/magicdian/adboost"
version = "3.2.2"
rust-version = "1.88.0"

# To build locally when working on a new release
[patch.crates-io]
adb_client = { path = "./adb_client" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"

[profile.release]
codegen-units = 1
debug-assertions = false
lto = "thin"
opt-level = 'z'
strip = true
