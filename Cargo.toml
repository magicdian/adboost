[workspace]
# Async rewrite (phase 0): temporarily narrowed to `adb_client` only.
# `adb_cli`, `pyadb_client`, and `examples/mdns` depend on the old sync API and
# will not compile until they are migrated in a later, separate task. They stay
# on disk but are excluded from this round's build/CI.
members = ["adb_client"]
resolver = "2"

[workspace.package]
authors = ["Corentin LIAUD", "jdjingdian"]
edition = "2024"
homepage = "https://github.com/magicdian/adboost"
keywords = ["adb", "android", "tcp", "usb"]
license = "Apache-2.0 AND MIT"
repository = "https://github.com/magicdian/adboost"
version = "3.2.2"
rust-version = "1.88.0"

# To build locally when working on a new release
[patch.crates-io]
adb_client = { path = "./adb_client" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"

[profile.release]
codegen-units = 1
debug-assertions = false
lto = "thin"
opt-level = 'z'
strip = true
